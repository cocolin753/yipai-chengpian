# XcodeGen 工程描述：云端 Mac 上运行 `xcodegen generate` 生成 YiPai.xcodeproj
name: YiPai
options:
  bundleIdPrefix: com.yipai
  deploymentTarget:
    iOS: "16.0"
packages:
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 2.0.1
  YiPaiCore:
    path: YiPaiCore
targets:
  YiPai:
    type: application
    platform: iOS
    sources:
      - path: YiPai
      # 识别模型（由 scripts/fetch_models.sh 下载），直接放在 App 包根目录
      - path: Models
        buildPhase: resources
    dependencies:
      - package: SherpaOnnx
        product: sherpa-onnx
      - package: YiPaiCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 一拍成片
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 拍摄视频需要使用相机
        NSMicrophoneUsageDescription: 录制声音并生成字幕需要使用麦克风
        NSPhotoLibraryAddUsageDescription: 把成品视频保存到相册
        NSPhotoLibraryUsageDescription: 从相册选择标题图片
        LSApplicationQueriesSchemes: [weixin, shortcuts]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yipai.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lc++"]
    scheme: {}
